[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-crons-dashboard"
version = "0.1.0"
description = "Prebuilt web dashboard assets for fastapi-crons. Install via 'pip install fastapi-crons[dashboard]'."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Mehar Umar", email="contact@meharumar.codes" }
]
keywords = ["fastapi", "cron", "scheduler", "dashboard", "monitoring"]
dependencies = []
requires-python = ">=3.10"

[project.urls]
"Homepage" = "https://github.com/me-umar/fastapi-crons"
"Documentation" = "https://crons.meharumar.codes"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapi_crons_dashboard*"]

# The bundle is the entire point of this distribution -- it must land in the
# wheel, not just the sdist.
[tool.setuptools.package-data]
fastapi_crons_dashboard = ["dashboard.html", "py.typed"]
