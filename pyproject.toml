[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-crons"
version = "2.4.0"
description = "Cron scheduling extension for FastAPI with decorators, async support, Hooks, CLI, and SQLite job tracking."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Mehar Umar", email="support@darcode.dev" }
]
keywords = ["fastapi", "cron", "scheduler", "background jobs", "tasks", "async crons", "fastapi crons", "crons"]
dependencies = [
  "fastapi>=0.100",
  "croniter>=1.3.0",
  "aiosqlite>=0.18.0",
  "typer[all]>=0.9.0",
  "rich",
  "redis",
  "pydantic>=2.0.0",
  "aiohttp",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "types-redis",
  "build>=1.0.0",
  "httpx>=0.28.1",
  "twine>=4.0.0",
]
otel = [
  "opentelemetry-api>=1.0.0",
  "opentelemetry-sdk>=1.0.0",
]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0.47",
]
sqlmodel = [
    "sqlalchemy[asyncio]>=2.0.47",
    "sqlmodel>=0.0.37",
]
# The dashboard bundle ships inside the wheel, so this extra needs nothing.
# It is kept so `pip install fastapi-crons[dashboard]` — which is already
# documented and published in 2.4.0's metadata — keeps working silently.
dashboard = []

[project.urls]
"Homepage" = "https://github.com/me-umar/fastapi-crons"
"Documentation" = "https://crons.darcode.dev"

[tool.setuptools.packages.find]
where = ["."]
# Without an explicit include, tests/, examples/ and scripts/ get published as
# top-level importable packages and collide with anything else named the same.
include = ["fastapi_crons*"]

# dashboard.html is not a .py file, so setuptools will not pick it up on its
# own. Without this the wheel builds fine but ships no bundle, and GET
# /dashboard raises FileNotFoundError on every pip install — which is exactly
# what happened in 2.3.0.
[tool.setuptools.package-data]
fastapi_crons = ["dashboard.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["fastapi_crons"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
build_command = "python -m pip install build && python -m build"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "chore:*",
    "test:*",
]
